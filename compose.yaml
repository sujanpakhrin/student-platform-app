services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: students
      MYSQL_USER: student_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - student_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-students.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e 'SELECT id FROM students LIMIT 1'
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
  backend:
    build: ./backend
    environment:
      DB_HOST: database
      DB_NAME: students
      DB_USER: student_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  student_data:
